<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ANNA-VIHAR|Login & Signup</title>
        <link rel="stylesheet" href="style.css" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        />
    </head>
    <body>
        <div id="container">
            <!-- Login -->
            <div class="login">
                <div class="content">
                    <h1>Log In</h1>
                    <form>
                        <input type="email" placeholder="email" />
                        <input type="password" placeholder="password" />
                        <span class="remember">Remember me</span>
                        <span class="forget">Forgot Password</span>
                        <span class="clearfix"></span>
                        <button onclick="return false;">Log In</button>
                    </form>

                    

                   
                </div>
            </div>

            <!-- Front Page -->
            <div class="page front">
                <div class="content">
                    <!-- User Icon -->
                   <img src="logo-annavihar.png" alt="Logo" class="userIcon">

                    <h1>New To Anna Vihar?</h1>
                    <p>Enter your personal details and start journey with us</p>

                    <button id="register">
                        Register
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- Back Page -->
            <div class="page back">
                <div class="content">
                    <!-- Login Icon -->
                   <img src="logo-annavihar.png" alt="Logo" class="userIcon">

                    <h1>Already A User?</h1>
                    <p>
                        To keep connected with us please login with your
                        personal info
                    </p>

                    <button id="login">
                        <i class="fa-solid fa-arrow-left"></i> Log In
                    </button>
                </div>
            </div>

            <!-- Register -->
            <div class="register">
                <div class="content">
                    <h1>Sign Up</h1>

                   

                    <form>
                        <input type="text" placeholder="name">
                        <input type="email" placeholder="email">
                        <input type="password" placeholder="password">
                        <span class="remember">I accept terms</span>
                        <span class="clearfix"></span>
                        <button onclick="return false;">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
